name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: deep-kumar-—-business-strategy,-technology-&-operations
        run: npm install

      - name: Build website
        working-directory: deep-kumar-—-business-strategy,-technology-&-operations
        run: npm run build

      - name: Verify SEO output
        working-directory: deep-kumar-—-business-strategy,-technology-&-operations
        run: |
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/index.html
          for route in about projects d-talks resume; do
            test -f "dist/$route/index.html"
          done
          grep -q 'https://deep6307.github.io/about/' dist/about/index.html
          grep -q 'ProfilePage' dist/about/index.html
          grep -q 'https://deep6307.github.io/sitemap.xml' dist/robots.txt

      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: deep-kumar-—-business-strategy,-technology-&-operations/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
